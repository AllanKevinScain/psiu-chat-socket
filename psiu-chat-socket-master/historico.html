<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Histórico do Psiu Chat</title>
  <style>
    body { margin: 0; background: #f4f6fa; color: #172238; font: 1rem/1.5 system-ui, sans-serif; }
    main { max-width: 52rem; margin: 3rem auto; padding: 0 1rem; }
    a { color: #234cad; }
    h1 { margin-bottom: .5rem; }
    ol { list-style: none; padding: 0; }
    li { background: white; border: 1px solid #dce2ec; border-radius: .65rem; padding: .8rem 1rem; margin-bottom: .5rem; }
    .instance { color: #46536a; font-size: .875rem; }
  </style>
  <script type="module" src="/js/presentation/activity-view.js"></script>
</head>
<body>
  <main>
    <a href="/">Voltar ao chat</a>
    <h1>Histórico de atividades</h1>
    <p id="status" role="status">Carregando eventos…</p>
    <ol id="events" aria-label="Eventos recentes"></ol>
  </main>
</body>
</html>
