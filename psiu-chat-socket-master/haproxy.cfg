defaults
  mode http
  timeout connect 3s
  timeout client 60s
  timeout server 60s
  timeout tunnel 1h

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s

frontend public_chat
  bind :8080
  default_backend chat

backend chat
  balance roundrobin
  cookie PSIU_NODE insert indirect nocache httponly
  option redispatch
  option httpchk GET /healthz
  http-check expect status 200
  default-server check inter 1s fall 2 rise 2 resolvers docker init-addr libc,none
  server a chat-a:3000 cookie a
  server b chat-b:3000 cookie b
